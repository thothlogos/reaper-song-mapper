name: Build draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v1.0.0)
        required: true
        type: string
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build matching installer and runtime
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python tests/release_test.py
          python scripts/build_release.py "$RELEASE_TAG"
          bash -n "dist/Install Song Mapper.command"
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Song Mapper $RELEASE_TAG" --notes "macOS: download Install Song Mapper.command, then run it after installing and quitting REAPER. See the README for installation details and macOS permissions." "dist/Install Song Mapper.command" dist/song-mapper-runtime.tar.gz dist/SHA256SUMS
