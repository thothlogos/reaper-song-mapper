name: Lua checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install bundled Lua runtime
        run: python -m pip install --only-binary=:all: -r tests/requirements.txt
      - name: Check Lua syntax and run unit tests
        run: python tests/run.py
